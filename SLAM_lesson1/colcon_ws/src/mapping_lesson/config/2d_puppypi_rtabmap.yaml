# Parameters for 2D LaserScan ICP odometry and RTAB-Map.
#
# The puppypi_test bag supplies /scan in the laser frame and the
# base_footprint -> laser transform on /tf. Topic names are remapped by the
# corresponding launch files.

/rtabmap/icp_odometry:
  ros__parameters:
    log_to_rosout_level: 1
    frame_id: base_footprint
    odom_frame_id: odom
    publish_tf: true
    wait_for_transform: 0.2
    wait_imu_to_init: false
    expected_update_rate: 11.0
    qos: 1
    deskewing: false

    scan_downsampling_step: 1
    scan_range_min: 0.02
    scan_range_max: 12.0
    scan_voxel_size: 0.03

    "Odom/Strategy": "0"
    "Odom/GuessMotion": "true"
    "Odom/ScanKeyFrameThr": "0.4"
    "OdomF2M/ScanSubtractRadius": "0.03"
    "OdomF2M/ScanMaxSize": "10000"
    "Reg/Strategy": "1"
    "Reg/Force3DoF": "true"
    "Icp/Strategy": "1"
    "Icp/PointToPlane": "false"
    "Icp/Iterations": "30"
    "Icp/VoxelSize": "0.03"
    "Icp/Epsilon": "0.001"
    "Icp/MaxTranslation": "1.0"
    "Icp/MaxCorrespondenceDistance": "0.3"
    "Icp/OutlierRatio": "0.7"
    "Icp/CorrespondenceRatio": "0.1"
    "Icp/ReciprocalCorrespondences": "false"

/rtabmap/rtabmap:
  ros__parameters:
    database_path: /workspace/lesson/maps/puppypi_rtabmap.db
    log_to_rosout_level: 1
    frame_id: base_footprint
    map_frame_id: map
    odom_frame_id: odom
    publish_tf: true
    subscribe_depth: false
    subscribe_rgb: false
    subscribe_scan: true
    subscribe_scan_cloud: false
    subscribe_odom_info: true
    approx_sync: false
    odom_sensor_sync: true
    wait_for_transform: 0.2
    qos: 1
    qos_scan: 1
    qos_odom: 1

    "Reg/Strategy": "1"
    "Reg/Force3DoF": "true"
    "Optimizer/GravitySigma": "0"
    "RGBD/ProximityBySpace": "true"
    "RGBD/ProximityMaxGraphDepth": "0"
    "RGBD/ProximityPathMaxNeighbors": "10"
    "RGBD/AngularUpdate": "0.05"
    "RGBD/LinearUpdate": "0.05"
    "RGBD/CreateOccupancyGrid": "true"
    "Grid/Sensor": "0"
    "Grid/3D": "false"
    "Grid/CellSize": "0.05"
    "Grid/RangeMin": "0.02"
    "Grid/RangeMax": "12.0"
    "Mem/NotLinkedNodesKept": "false"
    "Mem/STMSize": "30"
    "Icp/Strategy": "1"
    "Icp/PointToPlane": "false"
    "Icp/Iterations": "30"
    "Icp/VoxelSize": "0.03"
    "Icp/MaxTranslation": "1.0"
    "Icp/MaxCorrespondenceDistance": "0.3"
    "Icp/CorrespondenceRatio": "0.1"
    "Icp/ReciprocalCorrespondences": "false"

/rtabmap/rtabmap_viz:
  ros__parameters:
    frame_id: base_footprint
    odom_frame_id: odom
    subscribe_depth: false
    subscribe_rgb: false
    subscribe_scan: true
    subscribe_scan_cloud: false
    subscribe_odom_info: true
    approx_sync: false
    wait_for_transform: 0.2
    qos: 1
    qos_scan: 1
    qos_odom: 1
    odometry_node_name: icp_odometry
