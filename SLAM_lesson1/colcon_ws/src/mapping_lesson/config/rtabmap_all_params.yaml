# LiDAR odometry parameter catalog for RTAB-Map ROS 0.23.13
#
# This is a searchable LiDAR-SLAM reference for /rtabmap/icp_odometry,
# /rtabmap/rtabmap and /rtabmap/rtabmap_viz. It excludes camera odometry,
# visual features, markers and other non-LiDAR settings. Values are the current
# lesson configuration overlaid on the installed nodes' defaults.
#
# LiDAR odometry strategies compiled into the lesson image:
#   Odom/Strategy: 0 = frame-to-map ICP, 1 = frame-to-frame ICP.
#   Icp/Strategy:  0 = PCL, 1 = libpointmatcher.
# CCCoreLib ICP and the LOAM, FLOAM, LIO-SAM and Open3D odometry backends are
# not compiled into this image, so their parameters are intentionally omitted.

/rtabmap/icp_odometry:
  ros__parameters:
    # Icp/* — point-cloud registration
    Icp/CorrespondenceRatio: '0.01'
    Icp/DebugExportFormat: ''
    Icp/DownsamplingStep: '1'
    Icp/Epsilon: '0.001'
    Icp/FiltersEnabled: '3'
    Icp/Force4DoF: 'false'
    Icp/Iterations: '10'
    Icp/MaxCorrespondenceDistance: '1.0'
    Icp/MaxRotation: '0.78'
    Icp/MaxTranslation: '3'
    Icp/OutlierRatio: '0.7'
    Icp/PMConfig: ''
    Icp/PMMatcherEpsilon: '0.0'
    Icp/PMMatcherIntensity: 'false'
    Icp/PMMatcherKnn: '1'
    Icp/PointToPlane: 'true'
    Icp/PointToPlaneComplexityCentered: 'false'
    Icp/PointToPlaneGroundNormalsUp: '0.0'
    Icp/PointToPlaneK: '20'
    Icp/PointToPlaneLowComplexityStrategy: '1'
    Icp/PointToPlaneMinComplexity: '0.02'
    Icp/PointToPlaneRadius: '0'
    Icp/RangeMax: '0'
    Icp/RangeMin: '0'
    Icp/ReciprocalCorrespondences: 'true'
    Icp/Strategy: '1'
    Icp/VoxelSize: '0.1'

    # Odom/* — common odometry, filtering and scan-keyframe behavior
    Odom/AlignWithGround: 'false'
    Odom/Deskewing: 'true'
    Odom/FillInfoData: 'true'
    Odom/FilteringStrategy: '0'
    Odom/GuessMotion: 'true'
    Odom/GuessSmoothingDelay: '0'
    Odom/Holonomic: 'true'
    Odom/KalmanMeasurementNoise: '0.01'
    Odom/KalmanProcessNoise: '0.001'
    Odom/ParticleLambdaR: '100'
    Odom/ParticleLambdaT: '100'
    Odom/ParticleNoiseR: '0.002'
    Odom/ParticleNoiseT: '0.002'
    Odom/ParticleSize: '400'
    Odom/ResetCountdown: '0'
    Odom/ScanKeyFrameThr: '0.4'
    Odom/Strategy: '0'

    # OdomF2M/* — scan-specific frame-to-map local-map controls
    OdomF2M/ScanMaxSize: '15000'
    OdomF2M/ScanRange: '0'
    OdomF2M/ScanSubtractAngle: '45'
    OdomF2M/ScanSubtractRadius: '0.1'

    # Reg/* — registration degrees of freedom and retry behavior
    Reg/Force3DoF: 'false'
    Reg/RepeatOnce: 'true'
    Reg/Strategy: '1'

    # ROS node runtime, TF and update rates
    always_process_most_recent_frame: true
    config_path: ''
    expected_update_rate: 15.0
    frame_id: base_link
    initial_pose: ''
    max_update_rate: 0.0
    min_update_rate: 0.0
    publish_null_when_lost: true
    publish_tf: true
    start_type_description_service: true
    use_sim_time: false

    # IMU buffering and cloud deskewing
    always_check_imu_tf: true
    deskewing: false
    deskewing_slerp: false
    imu_queue_size: 200
    wait_imu_to_init: true

    # External motion prior
    guess_angular_variance: 0.001
    guess_frame_id: ''
    guess_linear_variance: 0.001
    guess_min_rotation: 0.0
    guess_min_time: 0.0
    guess_min_translation: 0.0

    # Input-cloud preprocessing
    scan_cloud_is_2d: false
    scan_cloud_max_points: 15000
    scan_downsampling_step: 1
    scan_normal_ground_up: 0.0
    scan_normal_k: 20
    scan_normal_radius: 0.0
    scan_range_max: 0.0
    scan_range_min: 0.0
    scan_voxel_size: 0.1

    # Odometry frames, queues, TF wait and QoS
    odom_frame_id: odom
    topic_queue_size: 1
    wait_for_transform: 0.2
    qos: 1
    qos_imu: 1

    # Logging and diagnostics
    log_to_rosout_level: 4
    diagnostic_updater:
      period: 2.0
      use_fqn: false

/rtabmap/rtabmap:
  ros__parameters:
    # GTSAM/* — active global graph optimizer backend
    GTSAM/IncRelinearizeSkip: '1'
    GTSAM/IncRelinearizeThreshold: '0.01'
    GTSAM/Incremental: 'false'
    GTSAM/Optimizer: '1'

    # Grid/* — local occupancy data generated from LiDAR scans
    Grid/3D: 'true'
    Grid/CellSize: '0.05'
    Grid/ClusterRadius: '0.1'
    Grid/FlatObstacleDetected: 'true'
    Grid/FootprintHeight: '0.0'
    Grid/FootprintLength: '0.0'
    Grid/FootprintWidth: '0.0'
    Grid/GroundIsObstacle: 'false'
    Grid/MapFrameProjection: 'false'
    Grid/MaxGroundAngle: '45'
    Grid/MaxGroundHeight: '0.0'
    Grid/MaxObstacleHeight: '0.0'
    Grid/MinClusterSize: '10'
    Grid/MinGroundHeight: '0.0'
    Grid/NoiseFilteringMinNeighbors: '5'
    Grid/NoiseFilteringRadius: '0.0'
    Grid/NormalK: '20'
    Grid/NormalsSegmentation: 'true'
    Grid/PreVoxelFiltering: 'true'
    Grid/RangeMax: '0'
    Grid/RangeMin: '0.0'
    Grid/RayTracing: 'false'
    Grid/Scan2dUnknownSpaceFilled: 'false'
    Grid/ScanDecimation: '1'
    Grid/Sensor: '0'

    # GridGlobal/* — global occupancy-grid assembly
    GridGlobal/AltitudeDelta: '0'
    GridGlobal/Eroded: 'false'
    GridGlobal/FloodFillDepth: '0'
    GridGlobal/FootprintRadius: '0.0'
    GridGlobal/MaxNodes: '0'
    GridGlobal/MinSize: '0.0'
    GridGlobal/OccupancyThr: '0.5'
    GridGlobal/ProbClampingMax: '0.971'
    GridGlobal/ProbClampingMin: '0.1192'
    GridGlobal/ProbHit: '0.7'
    GridGlobal/ProbMiss: '0.4'
    GridGlobal/UpdateError: '0.01'

    # Icp/* — LiDAR proximity and loop-closure registration
    Icp/CorrespondenceRatio: '0.2'
    Icp/DebugExportFormat: ''
    Icp/DownsamplingStep: '1'
    Icp/Epsilon: '0'
    Icp/FiltersEnabled: '3'
    Icp/Force4DoF: 'false'
    Icp/Iterations: '30'
    Icp/MaxCorrespondenceDistance: '1.0'
    Icp/MaxRotation: '0.78'
    Icp/MaxTranslation: '0.2'
    Icp/OutlierRatio: '0.85'
    Icp/PMConfig: ''
    Icp/PMMatcherEpsilon: '0.0'
    Icp/PMMatcherIntensity: 'false'
    Icp/PMMatcherKnn: '1'
    Icp/PointToPlane: 'true'
    Icp/PointToPlaneComplexityCentered: 'false'
    Icp/PointToPlaneGroundNormalsUp: '0.0'
    Icp/PointToPlaneK: '5'
    Icp/PointToPlaneLowComplexityStrategy: '1'
    Icp/PointToPlaneMinComplexity: '0.02'
    Icp/PointToPlaneRadius: '0'
    Icp/RangeMax: '0'
    Icp/RangeMin: '0'
    Icp/ReciprocalCorrespondences: 'true'
    Icp/Strategy: '1'
    Icp/VoxelSize: '0.1'

    # Mem/* — graph-node and stored LiDAR data management
    Mem/BinDataKept: 'true'
    Mem/CompressionParallelized: 'true'
    Mem/CovOffDiagIgnored: 'true'
    Mem/GenerateIds: 'true'
    Mem/IncrementalMemory: 'true'
    Mem/InitWMWithAllNodes: 'false'
    Mem/IntermediateNodeDataKept: 'false'
    Mem/LaserScanDownsampleStepSize: '1'
    Mem/LaserScanNormalK: '0'
    Mem/LaserScanNormalRadius: '0.0'
    Mem/LaserScanVoxelSize: '0.0'
    Mem/LocalizationDataSaved: 'false'
    Mem/LocalizationReadOnly: 'false'
    Mem/MapLabelsAdded: 'true'
    Mem/NotLinkedNodesKept: 'false'
    Mem/ReduceGraph: 'false'
    Mem/STMSize: '30'
    Mem/UseOdomGravity: 'false'

    # Optimizer/* — global pose-graph optimization
    Optimizer/Epsilon: '0.00001'
    Optimizer/GravitySigma: '0.3'
    Optimizer/Iterations: '20'
    Optimizer/PriorsIgnored: 'true'
    Optimizer/Robust: 'false'
    Optimizer/RobustKernelDelta: '8'
    Optimizer/Strategy: '2'
    Optimizer/VarianceIgnored: 'false'

    # RGBD/* — generic graph update and LiDAR proximity-closure controls
    # The prefix is historical; these parameters also drive LiDAR-only SLAM.
    RGBD/AngularSpeedUpdate: '0.0'
    RGBD/AngularUpdate: '0.05'
    RGBD/CreateOccupancyGrid: 'false'
    RGBD/Enabled: 'true'
    RGBD/ForceOdom3DoF: 'true'
    RGBD/InvertedReg: 'false'
    RGBD/LinearSpeedUpdate: '0.0'
    RGBD/LinearUpdate: '0.05'
    RGBD/LocalImmunizationRatio: '0.25'
    RGBD/LocalRadius: '10'
    RGBD/LocalizationPriorError: '0.001'
    RGBD/LocalizationSecondTryWithoutProximityLinks: 'true'
    RGBD/LocalizationSmoothing: 'true'
    RGBD/LoopClosureIdentityGuess: 'false'
    RGBD/LoopCovLimited: 'false'
    RGBD/MaxLocalRetrieved: '2'
    RGBD/MaxLoopClosureDistance: '0.0'
    RGBD/MaxOdomCacheSize: '10'
    RGBD/NeighborLinkRefining: 'false'
    RGBD/NewMapOdomChangeDistance: '0'
    RGBD/OptimizeFromGraphEnd: 'false'
    RGBD/OptimizeMaxError: '3.0'
    RGBD/OptimizeMaxErrorRepairRadius: '0.0'
    RGBD/ProximityAngle: '45'
    RGBD/ProximityBySpace: 'true'
    RGBD/ProximityByTime: 'false'
    RGBD/ProximityGlobalScanMap: 'false'
    RGBD/ProximityMaxGraphDepth: '0'
    RGBD/ProximityMaxPaths: '3'
    RGBD/ProximityMergedScanCovFactor: '100.0'
    RGBD/ProximityOdomGuess: 'false'
    RGBD/ProximityPathFilteringRadius: '1'
    RGBD/ProximityPathMaxNeighbors: '1'
    RGBD/ProximityPathRawPosesUsed: 'true'
    RGBD/ScanMatchingIdsSavedInLinks: 'true'
    RGBD/StartAtOrigin: 'false'

    # Reg/* — use ICP-only registration for LiDAR constraints
    Reg/Force3DoF: 'false'
    Reg/RepeatOnce: 'true'
    Reg/Strategy: '1'

    # Rtabmap/* — SLAM processing, graph publication and working memory
    Rtabmap/ComputeRMSE: 'true'
    Rtabmap/CreateIntermediateNodes: 'false'
    Rtabmap/DetectionRate: '1'
    Rtabmap/MemoryThr: '0'
    Rtabmap/PublishLastSignature: 'true'
    Rtabmap/PublishLikelihood: 'true'
    Rtabmap/PublishPdf: 'true'
    Rtabmap/PublishRAMUsage: 'false'
    Rtabmap/PublishStats: 'true'
    Rtabmap/SaveWMState: 'false'
    Rtabmap/StartNewMapOnGoodSignature: 'false'
    Rtabmap/StartNewMapOnLoopClosure: 'false'
    Rtabmap/StatisticLogged: 'false'
    Rtabmap/StatisticLoggedHeaders: 'true'
    Rtabmap/StatisticLogsBufferedInRAM: 'true'
    Rtabmap/TimeThr: '0'
    Rtabmap/WorkingDirectory: /root/.ros

    # Database and node lifecycle
    config_path: ''
    database_path: /root/.ros/rtabmap.db
    delete_db_on_start: false
    initial_pose: ''
    is_rtabmap_paused: false
    start_type_description_service: true
    use_saved_map: true
    use_sim_time: false

    # TF, odometry and LiDAR subscriptions
    frame_id: base_link
    map_frame_id: map
    odom_frame_id: odom
    odom_frame_id_init: ''
    odom_sensor_sync: true
    odom_tf_angular_variance: 0.001
    odom_tf_linear_variance: 0.001
    publish_tf: true
    scan_cloud_is_2d: false
    scan_cloud_max_points: 0
    subscribe_inter_odom_info: false
    subscribe_odom: true
    subscribe_odom_info: true
    subscribe_scan: false
    subscribe_scan_cloud: true
    subscribe_scan_descriptor: false
    subscribe_sensor_data: false

    # Generated map/cloud publication
    cloud_output_voxelized: true
    cloud_subtract_filtering: false
    cloud_subtract_filtering_min_neighbors: 2
    latch: true
    loc_thr: 0.0
    map_always_update: false
    map_cache_loaded_on_init: true
    map_cleanup: true
    map_empty_ray_tracing: true
    map_filter_angle: 30.0
    map_filter_radius: 0.0

    # Synchronization, queues and QoS
    approx_sync: false
    qos: 1
    qos_odom: 1
    qos_scan: 1
    queue_size: -1
    staleness_factor: 0.0
    sync_queue_size: 10
    tf_delay: 0.05
    tf_tolerance: 0.1
    topic_queue_size: 10
    wait_for_transform: 0.2

    # Logging and diagnostics
    log_to_rosout_level: 4
    diagnostic_updater:
      period: 2.0
      use_fqn: false

/rtabmap/rtabmap_viz:
  ros__parameters:
    # RTAB-Map and odometry connections
    frame_id: base_link
    odom_frame_id: odom
    odom_sensor_sync: true
    odometry_node_name: icp_odometry
    rtabmap_node_name: rtabmap
    init_cache_path: ''
    is_rtabmap_paused: false
    max_odom_update_rate: 10.0

    # LiDAR, odometry and graph-info subscriptions
    subscribe_info_only: false
    subscribe_odom: true
    subscribe_odom_info: true
    subscribe_scan: false
    subscribe_scan_cloud: true
    subscribe_scan_descriptor: false
    subscribe_sensor_data: false

    # Synchronization, queues and QoS
    approx_sync: false
    qos: 1
    qos_odom: 1
    qos_scan: 1
    queue_size: -1
    sync_queue_size: 10
    topic_queue_size: 10
    wait_for_transform: 0.2

    # Runtime and diagnostics
    start_type_description_service: true
    use_sim_time: false
    diagnostic_updater:
      period: 2.0
      use_fqn: false
