services:
  zenoh_router:
    image: klass_slam_lesson1
    container_name: zenoh_router
    command: ros2 run rmw_zenoh_cpp rmw_zenohd
    network_mode: host
    environment:
      RMW_IMPLEMENTATION: rmw_zenoh_cpp

  klass_slam_lesson1:
    image: klass_slam_lesson1
    container_name: klass_slam_lesson1
    volumes:
      - ./colcon_ws/src:/workspace/lesson/src
      - ./maps:/workspace/lesson/maps
      - ./bag_files:/workspace/lesson/bag_files
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ${XAUTHORITY}:/root/.Xauthority:ro
    working_dir: /workspace/lesson/colcon_ws
    stdin_open: true
    tty: true
    network_mode: host
    ipc: host
    depends_on:
      - zenoh_router
    # Intel/AMD: hardware OpenGL for GUI (avoid llvmpipe over X11 only).
    devices:
      - /dev/dri:/dev/dri
    # Host GIDs for /dev/dri (video/render). Override if your machine differs:
    #   stat -c '%g' /dev/dri/renderD128 /dev/dri/card1
    group_add:
      - "${RENDER_GID:-110}"
      - "${VIDEO_GID:-44}"
    environment:
      RMW_IMPLEMENTATION: rmw_zenoh_cpp
      # Environment variables needed to use GUI inside the container
      DISPLAY: ${DISPLAY}
      QT_X11_NO_MITSHM: "1"
      XAUTHORITY: /root/.Xauthority